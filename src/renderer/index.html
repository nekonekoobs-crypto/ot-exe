<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OT TRACSA</title>
<link rel="stylesheet" href="vendor/gentelella.css">
<link rel="stylesheet" href="app.css">
</head>
<body>

<!-- Inicio de sesión -->
<div class="auth-page" id="pantalla-login" hidden>
  <div class="auth-card">
    <div class="auth-brand">
      <img src="logo.png" alt="TRACSA" class="auth-logo">
    </div>
    <div class="auth-title">OT Almacén</div>
    <div class="auth-subtitle">Inicia sesión para continuar.</div>
    <form id="form-login" autocomplete="on">
      <div class="form-group">
        <label class="form-label" for="login-correo">Correo</label>
        <input type="email" id="login-correo" class="form-control" placeholder="tu@correo.com" required autocomplete="username">
      </div>
      <div class="form-group">
        <label class="form-label" for="login-clave">Contraseña</label>
        <input type="password" id="login-clave" class="form-control" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <div id="login-error" class="form-error" role="alert" hidden></div>
      <button type="submit" id="btn-entrar" class="btn btn-primary btn-ancho">Entrar</button>
    </form>
    <div class="auth-divider">o</div>
    <button type="button" id="btn-google" class="btn btn-outline btn-ancho">
      <svg viewBox="0 0 16 16" width="16" height="16"><path fill="#4285F4" d="M14.5 8.16c0-.5-.05-1-.13-1.5H8v2.83h3.65a3.13 3.13 0 01-1.36 2.05v1.7h2.2c1.28-1.18 2.01-2.92 2.01-5.08z"/><path d="M8 15c1.83 0 3.36-.6 4.49-1.65l-2.2-1.7c-.6.4-1.38.65-2.29.65-1.76 0-3.25-1.19-3.78-2.78H1.95v1.74A6.74 6.74 0 008 15z" fill="#34A853"/><path d="M4.22 9.52a4.07 4.07 0 010-2.59V5.19H1.95a6.74 6.74 0 000 5.62l2.27-1.29z" fill="#FBBC04"/><path d="M8 4.46c.99 0 1.88.34 2.59 1l1.94-1.94A6.74 6.74 0 008 1.5a6.74 6.74 0 00-6.05 3.69L4.22 6.93C4.75 5.34 6.24 4.46 8 4.46z" fill="#EA4335"/></svg>
      Continuar con Google
    </button>
    <p class="auth-nota">Con Google se abrirá tu navegador para elegir la cuenta. Si es tu primera vez, un almacenista debe aprobar tu acceso.</p>
  </div>
</div>

<!-- Aplicación -->
<div id="app" hidden>
  <aside class="sidebar" id="sidebar" aria-label="Menú principal">
    <div class="sidebar-brand">
      <img src="logo.png" alt="TRACSA" class="brand-logo">
    </div>
    <nav class="sidebar-nav" id="menu"></nav>
    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="avatar" id="avatar">?<span class="online"></span></div>
        <div class="sidebar-user-info">
          <div class="name" id="usr-correo">—</div>
          <div class="role" id="usr-rol">—</div>
        </div>
        <button class="more-btn" id="btn-salir" title="Cerrar sesión" aria-label="Cerrar sesión">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        </button>
      </div>
    </div>
  </aside>

  <header class="topbar">
    <div class="topbar-left">
      <button class="sidebar-toggle" id="btn-menu" type="button" aria-label="Abrir menú">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <nav class="breadcrumb" id="migas" aria-label="Ubicación"></nav>
    </div>
    <div class="search-box" id="caja-busqueda">
      <svg class="s-icon" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="7" cy="7" r="5"/><path d="M11 11l3.5 3.5"/></svg>
      <input type="text" id="busqueda" placeholder="Buscar OT, seguro, unidad, VIN…" aria-label="Buscar">
    </div>
    <div class="topbar-right">
      <span class="estado-sync" id="estado-sync" title="Estado de la sincronización">—</span>
      <button class="tb-btn" id="btn-sync" type="button" title="Sincronizar ahora" aria-label="Sincronizar ahora">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M21 12a9 9 0 01-15.5 6.2L3 16M3 12a9 9 0 0115.5-6.2L21 8M21 3v5h-5M3 21v-5h5"/></svg>
      </button>
      <button class="tb-btn theme-toggle" id="btn-tema" type="button" title="Cambiar tema" aria-label="Cambiar tema">
        <svg class="theme-icon-light" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        <svg class="theme-icon-dark" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <img src="logo.png" alt="TRACSA" class="topbar-logo">
    </div>
  </header>

  <main class="main"><div class="page-wrapper" id="vista"></div></main>
</div>

<div class="toast-host" id="toasts" aria-live="polite"></div>
<div id="capa-modal"></div>

<script src="../lib/fechas.js"></script>
<script src="../lib/models.js"></script>
<script src="../lib/ocrparser.js"></script>
<script src="app.js"></script>
</body>
</html>
